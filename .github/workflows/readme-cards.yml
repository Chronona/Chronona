name: Update README cards

on:
  schedule: # execute once a day at 03:00 UTC (offset from profile-summary-cards)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate

    steps:
      - uses: actions/checkout@v4

      # Cards are generated here and committed as static SVGs instead of being
      # fetched from a public instance on every README view. Both upstream
      # projects recommend this: the public github-readme-stats endpoint is
      # rate-limited, and github-profile-trophy's maintainer asks users to stop
      # loading the shared instance.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e52ecffb9b500c9f8532aff89937973d64706446 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&show_icons=true&theme=onedark&rank_icon=github
          path: readme-cards/stats.svg
          token: ${{ secrets.SECRET_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e52ecffb9b500c9f8532aff89937973d64706446 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=onedark
          path: readme-cards/top-langs.svg
          token: ${{ secrets.SECRET_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate trophy card
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7 # master
        with:
          username: ${{ github.repository_owner }}
          output_path: readme-cards/trophy.svg
          theme: onedark
          token: ${{ secrets.SECRET_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme-cards/*.svg
          git commit -m "Update README cards" || exit 0
          git push
